<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-card">
            <div class="login-brand">
                <span class="brand-dot"></span>
                <div>
                    <p class="brand-label">Admin panel</p>
                    <h1>Área Administrativa</h1>
                </div>
            </div>

            <div class="login-header">
                <h2>Login</h2>
                <p>Entre para gerir formações e inscrições.</p>
            </div>

            <form id="formLogin" class="login-form">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Digite o seu usuário" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite a sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary login-btn">Entrar</button>
            </form>

            <p id="mensagemLogin" class="mensagem"></p>
        </section>
    </main>

    <script src="js/admin.js"></script>

</body>

</html>
