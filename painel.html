<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>
</head>

<body>

    <h1>Painel Administrativo</h1>
    <button id="btnLogout">Sair</button>

    <h2>Adicionar Formação</h2>

<form id="formFormacao">

    <label for="nomeFormacao">Nome:</label>
    <input
        type="text"
        id="nomeFormacao"
        required
    >

    <br><br>

    <label for="descricaoFormacao">Descrição:</label>
    <textarea
        id="descricaoFormacao"
        required
    ></textarea>

    <br><br>

    <label for="modalidadeFormacao">Modalidade:</label>
    <select id="modalidadeFormacao" required>
        <option value="">Selecione</option>
        <option value="Online">Online</option>
        <option value="Presencial">Presencial</option>
    </select>

    <br><br>

    <label for="precoFormacao">Preço:</label>
    <input
        type="number"
        id="precoFormacao"
        required
    >

    <br><br>

    <button type="submit">
        Adicionar Formação
    </button>

</form>

<p id="mensagemFormacao"></p>
    <p>Bem-vindo ao painel!</p>

    <h2>Inscrições</h2>

<table border="1">

    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Formação</th>
            <th>Data</th>
        </tr>
    </thead>

    <tbody id="listaInscricoes">
    </tbody>

</table>

    <script src="js/painel.js"></script>

</body>

</html>
